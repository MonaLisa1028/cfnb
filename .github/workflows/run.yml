name: Run CFNB Regularly

on:
  workflow_dispatch: # 支持手动点击运行
  schedule:
    - cron: '0 */2 * * *' # 每 2 小时自动开机

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false # 💡 核心改动 1：禁用默认的只读凭证，防止它自动连接原作者仓库

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run main script
      # ✅ 纯正作者测速逻辑，不改动任何测速核心
      run: |
        python main.py

    - name: Commit and Push changes
      env:
        MY_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if [ -f "ip.txt" ]; then
          # 💡 强力纠偏外挂：不管原文件多乱，精准拦截提取我们要的数量
          grep "#HK" ip.txt | head -n 5 > temp_ip.txt
          grep "#JP" ip.txt | head -n 2 >> temp_ip.txt
          grep "#US" ip.txt | head -n 3 >> temp_ip.txt
          
          # 将排版完美的结果覆盖回 ip.txt
          mv temp_ip.txt ip.txt
          
          git add ip.txt
          git commit -m "Automated IP Update with Custom Sorting" || exit 0
          git push "https://MonaLisa1028:${MY_TOKEN}@github.com/MonaLisa1028/cfnb.git" HEAD:main --force
        fi

name: Run CFNB Regularly
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          # 自动修复环境依赖缺失问题
          pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 自动查找 main.py 的位置并运行
          if [ -f "main.py" ]; then python main.py; else find . -name "main.py" -exec python {} \;; fi

      - name: Commit and Push changes
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 纠偏外挂：按 HK-5, JP-2 裁剪并重新排序
          if [ -f "ip.txt" ]; then
            grep -E "#HK" ip.txt | sort -t' ' -k2 -nr | head -n 5 > temp_ip.txt
            grep -E "#JP" ip.txt | sort -t' ' -k2 -nr | head -n 2 >> temp_ip.txt
            mv temp_ip.txt ip.txt
            
            git add ip.txt
            git commit -m "Automated IP Update: Asia-Only Strategy" || exit 0
            git push "https://MonaLisa1028:${MY_TOKEN}@github.com/MonaLisa1028/cfnb.git" HEAD:main --force
          fi

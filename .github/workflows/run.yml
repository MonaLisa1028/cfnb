name: Run CFNB Regularly

on:
  workflow_dispatch: # 支持手动点击运行
  schedule:
    - cron: '0 */2 * * *' # 每 2 小时自动开机

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run main script
      # ✅ 纯正作者测速逻辑，不夹带任何修改
      run: |
        python main.py

    - name: Commit and Push changes
      # ✅ 带着你锁好的永久钥匙，精准推回你自己的项目，绝不乱撞
      env:
        MY_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add ip.txt
        git commit -m "Automated IP Update" || exit 0
        git push "https://x-access-token:${MY_TOKEN}@github.com/MonaLisa1028/cfnb.git" HEAD:main

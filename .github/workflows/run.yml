name: Run CFNB Regularly

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 💡 优化：先检查文件是否存在，防止报错
      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          python main.py

      - name: Commit and Push changes
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f "ip.txt" ]; then
            # 💡 精准重组外挂：HK-5, JP-2, US-3 比例裁剪
            # 使用 -E 支持扩展正则表达式，确保筛选准确
            grep -E "#HK" ip.txt | sort -t' ' -k2 -nr | head -n 5 > temp_ip.txt
            grep -E "#JP" ip.txt | sort -t' ' -k2 -nr | head -n 2 >> temp_ip.txt
            
            mv temp_ip.txt ip.txt
            
            git add ip.txt
            git commit -m "Automated IP Update: HK5-JP2-US3 Logic" || exit 0
            git push "https://MonaLisa1028:${MY_TOKEN}@github.com/MonaLisa1028/cfnb.git" HEAD:main --force
          fi

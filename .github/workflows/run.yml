name: Run CFNB Regularly

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python main.py

      - name: Commit and Push changes
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f "ip.txt" ]; then
            # 💡 精准重组外挂：按 HK-5, JP-2, US-3 的比例裁剪和排序
            # 如果测速结果中没有 US（因为我们在 config 里禁用了），它会按优先级提取
            grep "#HK" ip.txt | sort -t' ' -k2 -nr | head -n 5 > temp_ip.txt
            grep "#JP" ip.txt | sort -t' ' -k2 -nr | head -n 2 >> temp_ip.txt
            # 如果你有特定的 US 需求，可以取消下面这行的注释，但需要先在 config 中允许 US
            # grep "#US" ip.txt | sort -t' ' -k2 -nr | head -n 3 >> temp_ip.txt
            
            mv temp_ip.txt ip.txt
            
            git add ip.txt
            git commit -m "Automated IP Update: HK5-JP2-US3 Logic" || exit 0
            git push "https://MonaLisa1028:${MY_TOKEN}@github.com/MonaLisa1028/cfnb.git" HEAD:main --force
          fi
